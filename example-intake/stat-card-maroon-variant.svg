<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <!-- Background card - maroon variant -->
  <rect x="0" y="0" width="320" height="180" rx="8" fill="#8c1d40"/>

  <!-- Gold accent bar at top -->
  <rect x="0" y="0" width="320" height="4" rx="8" fill="#ffc627"/>
  <rect x="0" y="2" width="320" height="4" fill="#ffc627"/>

  <!-- Icon circle -->
  <circle cx="40" cy="50" r="20" fill="#ffc627" opacity="0.2"/>
  <text x="40" y="56" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">🎓</text>

  <!-- Stat number -->
  <text x="24" y="110" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff">98%</text>

  <!-- Label -->
  <text x="24" y="140" font-family="Arial, sans-serif" font-size="14" fill="#ffc627">Graduation Rate</text>

  <!-- Optional trend indicator -->
  <text x="24" y="162" font-family="Arial, sans-serif" font-size="12" fill="#78be20">▲ 3% year over year</text>
</svg>
