# Generated from .agents/config/mcp-servers.json.
# Run: node .agents/scripts/sync-ai-config.mjs
# Do not edit MCP entries in this file directly.

[agents]
max_concurrent_threads_per_session = 4

[mcp_servers.mcp_atlassian]
command = "uvx"
args = ["mcp-atlassian", "--read-only"]
env_vars = ["JIRA_USERNAME", "JIRA_API_TOKEN", "CONFLUENCE_USERNAME", "CONFLUENCE_API_TOKEN"]

[mcp_servers.mcp_atlassian.env]
JIRA_URL = "https://asudev.jira.com"
CONFLUENCE_URL = "https://asudev.jira.com/wiki"
READ_ONLY_MODE = "true"

[mcp_servers.figma]
url = "http://127.0.0.1:3845/mcp"

[mcp_servers.asu_unity_react_core]
